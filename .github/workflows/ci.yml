# The second party.
#
# This repository has one developer and its merged pull requests carry zero
# reviews, so nothing has ever checked a change except the agent that wrote it.
# That is the gap this file closes, and it is a bigger one than "run the tests":
# the house rules' position (PROVING.md, "the loop") is that a model's claim to
# have run something is not evidence it ran, and until now the finishing
# checklist in FINISHING.md was asserted by the party being checked.
#
# So the point is mostly not the commands. Most steps below are ones a developer
# runs by hand; the point is that they run on a machine nobody is logged into,
# against the pushed ref rather than a working tree, whether or not anyone
# remembered.
#
# Two are exceptions, and both exist because what they check is not a property
# of the tree that a hand-run command would reach:
#
#   - `Rules owed` reads the pull request body. The finishing checklist has one
#     question with no exit code behind it, and a question with no exit code is
#     skipped in silence.
#   - `No budget override` refuses the length budget's local escape hatch. It is
#     about the environment the run happens in, so running it by hand proves
#     nothing about the runner.
#
# There is no build step (Node strips types at runtime) and no deploy: this is
# not a deployed service. Adding one here would be a stage that never runs, and
# BUILDING.md's dead-code rule would have it deleted.

name: ci

on:
  push:
    branches: [main]
  # `edited` is not in the default set — that is `opened`, `synchronize`,
  # `reopened` — and it has to be here because the last step reads
  # `github.event.pull_request.body`, which comes from the event payload rather
  # than from the API. Without it, a run that failed for a missing
  # `Rules owed:` line stays red no matter what you write in the body, and
  # re-running it replays the *old* payload: the only way to clear it is to push
  # a commit. Measured on #24, which is the pull request that adds this line.
  # The remedy that step's own error message names has to be a remedy that
  # works, or the step teaches people to route around it.
  pull_request:
    types: [opened, synchronize, reopened, edited]

# A superseded run tells you about a commit nobody is looking at any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Each step is one of the commands in the finishing checklist, named the
    # same way, so a red run points at the rule it broke rather than at a log.
    steps:
      # `fetch-depth: 0` is load-bearing, not caution. The default is 1, which
      # gives a detached HEAD and no `origin/main` at all, and the length
      # budget's ratchet resolves its baseline with `git merge-base HEAD
      # origin/main` (src/cli/length-budget.ts). With a shallow checkout that
      # resolves to nothing, and `docs:check` does not shrug: it pushes a
      # problem and exits 1. Measured — running `docs:check` in a copy of this
      # tree with no reachable baseline gives `length budget ratchet: no
      # baseline to compare ceilings against` and `exit=1`. So the shallow
      # default would have failed the Docs step on every pull request, and the
      # branch that added the ratchet is the branch that would have discovered
      # it in CI rather than here.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pinned rather than floated. `packageManager` in package.json is the
      # single source for the version; `run_install: false` because the cache
      # below has to be configured before anything is fetched.
      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          # Read from `engines.node` rather than written out here. A second
          # literal is a second thing to update, and STARTING.md is explicit
          # that a fact lives in one place and is cited from the others.
          #
          # The cost, stated rather than discovered later: `engines.node` is a
          # range, so this floats to the newest Node satisfying it. That is the
          # honest reading of a package that claims to support ">=24" — but it
          # means a new major can turn this red on a pull request that did not
          # touch anything. If that becomes annoying rather than informative,
          # pin the major here and accept the duplicate literal.
          node-version-file: package.json
          cache: pnpm

      # --frozen-lockfile is the whole reason this step is not `pnpm install`.
      # A lockfile the CI is allowed to rewrite is a lockfile that proves
      # nothing about what a developer will get.
      - name: Install
        run: pnpm install --frozen-lockfile

      # `continue-on-error` is deliberately absent everywhere below. A check
      # that cannot fail the run is a check that reports rather than guards,
      # and BUILDING.md's rule is that a guard fails closed.
      - name: Types
        run: pnpm check-types

      - name: Lint
        run: pnpm lint

      # Formatting is checked, never applied. A CI job that rewrites the tree
      # and pushes it is a second author on the branch.
      - name: Format
        run: pnpm format:check

      - name: Tests
        run: pnpm test

      # The hook guards are not vitest, so `pnpm test` above does not touch
      # them — and they are the only mechanical enforcement of the two rules
      # that are not advisory. One of them once failed open on a branch name
      # containing a quote while still looking installed, which is the whole
      # argument for running them somewhere nobody can forget.
      - name: Hook guards
        run: pnpm test:hooks

      # Prose checked against the tree: numbers cited in it, links, pinned
      # copies, and — since the length budget landed — how long the documents an
      # agent must read before starting have got. Its own step rather than part
      # of Tests: it collects the suite with `vitest list` instead of running
      # it, so it costs about three seconds rather than a full run, and a
      # failure here means a document is lying rather than that the code is
      # broken. It was about one second before the two checks this branch added;
      # most of the rest is rule-citations' `git log` pickaxe searches.
      - name: Docs
        run: pnpm docs:check

      # The length budget's ceilings can only be lowered, and the one way past
      # that — `DOCS_CHECK_RAISE_BUDGET`, see src/cli/length-budget.ts — is a
      # local escape hatch for the single commit that widens a ceiling on
      # purpose. It must never be how a branch goes green on a machine nobody is
      # logged into, so a run carrying it is refused: in this job's environment,
      # or written into any workflow here.
      #
      # What it does not cover, stated rather than discovered: a `run:` block
      # that sets the variable inline on the command. That is deliberate — the
      # grep is anchored to an assignment at the start of a line, because a
      # pattern loose enough to catch every form also catches this comment, and
      # a step that fails on its own explanation gets deleted.
      - name: No budget override
        run: |
          if [ -n "${DOCS_CHECK_RAISE_BUDGET:-}" ] ||
             grep -REn '^[[:space:]]*DOCS_CHECK_RAISE_BUDGET[[:space:]]*:' .github/workflows/; then
            echo "::error::A raised length budget is a local escape hatch, never a CI one."
            exit 1
          fi

      # The one check here that is not a command, and cannot be.
      #
      # FINISHING.md's fourth question — did something get through that these
      # rules do not cover? — is the only item on that page with nothing
      # mechanical behind it, and it went unanswered in silence for as long as
      # it existed. Four lessons were written up carefully and filed where
      # nothing loads them before anyone noticed, and what noticed was a person
      # asking.
      #
      # This cannot tell a true `Rules owed: none` from a false one, and does
      # not try. It guarantees the question was answered, which is the whole of
      # its job: it turns an omission from invisible into red.
      #
      # Skipped on push, where there is no body to read. That is a real hole —
      # anything reaching `main` outside a pull request is unchecked by this —
      # and it is the same hole as rule 2 itself, which says nothing reaches
      # `main` that way.
      #
      # The body is read through the environment and never interpolated into
      # the script. A pull request body is untrusted input from anyone who can
      # open one, and `${{ }}` inside a `run:` block is exactly how untrusted
      # input becomes execution.
      - name: Rules owed
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Anchored to the start of a line, so prose that merely mentions the
          # phrase does not satisfy it — measured: drop the `^` and "there are
          # no Rules owed: at all" passes. Everything before the phrase is the
          # set of ways a person legitimately writes a line in Markdown: a list
          # marker, a heading, bold. Rejecting `- Rules owed: none` would be a
          # false positive on a correct answer, which is how a check earns the
          # contempt that gets it deleted.
          pattern='^[[:space:]]*([-*+][[:space:]]+)?(#+[[:space:]]*)?\*{0,2}Rules owed:'
          if printf '%s' "$PR_BODY" | grep -Eq "$pattern"; then
            printf '%s' "$PR_BODY" | grep -E "$pattern"
            exit 0
          fi
          echo "::error::No 'Rules owed:' line in this pull request body."
          cat <<'EOF'
          FINISHING.md asks, on the way out: did something get through that these
          rules do not cover? Answer it in the pull request body, either

              Rules owed: none
              Rules owed: <what, and where it is being written>

          A `none` you have actually checked is a fine answer. An unanswered
          question is not, which is the only thing this step can tell apart.

          See .claude/skills/dev-house-rules/FINISHING.md — "The rules you owe
          are written down, or they are not owed".
          EOF
          exit 1
